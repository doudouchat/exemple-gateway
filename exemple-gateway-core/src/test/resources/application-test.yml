logging:
   pattern:
      console: "%d %-5p: %C - %m%n"
   level:
      root: WARN
      com.exemple.gateway: DEBUG
      org.springframework.security: TRACE
      org.springframework.cloud: TRACE
gateway:
   security:
      excludes: /ExempleAuthorization/login, /*/info, /*/health, /*/openapi.json
      csrf:
         excludes: /ExempleAuthorization/oauth/*
spring:
   hazelcast:
      config: file:${project.build.testOutputDirectory}/hazelcast.yaml
   security:
      oauth2:
         resourceserver:
            jwt:
               public-key-location: classpath:public_key
         client:
            provider:
               test:
                  token-uri: http://localhost:${authorization.port}/ExempleAuthorization/token
                  authorization-uri: http://localhost:${authorization.port}/ExempleAuthorization/authorize
            registration:
                exemple-user:
                  client-id: client-user
                  client-secret: client-user-secret
                  client-authentication-method: client_secret_basic
                  authorization-grant-type: authorization_code
                  redirect-uri: http://test/redirect-uri
                  provider: test
                exemple-app:
                  client-id: client-app
                  client-secret: client-app-secret
                  client-authentication-method: client_secret_basic
                  authorization-grant-type: client_credentials
                  provider: test
   cloud:
      gateway:
         server:
            webflux:
               routes:
               -  id: api-service-app
                  uri: http://localhost:${api.port}
                  predicates:
                  - Path=/ExempleService
                  filters:
                  - TokenRelay=exemple-app
                  - SaveSession
               -  id: api-service-user
                  uri: http://localhost:${api.port}
                  predicates:
                  - Path=/ExempleService/account/**
                  filters:
                  - TokenRelay=exemple-user
               -  id: authorization-login
                  uri: http://localhost:${authorization.port}
                  predicates:
                  - Path=/ExempleAuthorization/login
                  filters:
                  - RewriteLocationResponseHeader=NEVER_STRIP, Location, ,
                  - SetStatus200IfRedirection=
                  - RemoveResponseHeader=Location
api:
   port: ${api.port}
authorization:
   port: ${authorization.port}
public_key: classpath:public_key
private_key: classpath:private_key