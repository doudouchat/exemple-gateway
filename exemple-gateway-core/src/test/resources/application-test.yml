logging:
   pattern:
      console: "%d %-5p: %C - %m%n"
   level:
      root: WARN
      com.exemple.gateway: DEBUG
      org.springframework.cloud.gateway: DEBUG
gateway:
   security:
      excludes: /*/info, /*/health, /*/openapi.json, /ExempleAuthorization/**
      csrf:
         excludes: /ExempleAuthorization/oauth/*
spring:
   hazelcast:
      config: file:${project.build.testOutputDirectory}/hazelcast.yaml
   security:
      oauth2:
         resourceserver:
            jwt:
               public-key-location: classpath:public_key
         client:
            provider:
               test:
                  token-uri: http://test/token
                  authorization-uri: http://test/authorize
            registration:
                exemple-user:
                  client-id: client-user
                  client-secret: client-user-secret
                  client-authentication-method: client_secret_basic
                  authorization-grant-type: authorization_code
                  redirect-uri: http://test/redirect-uri
                  provider: test
                exemple-app:
                  client-id: client-app
                  client-secret: client-app-secret
                  client-authentication-method: client_secret_basic
                  authorization-grant-type: authorization_code
                  redirect-uri: http://test/redirect-uri
                  provider: test
   cloud:
      gateway:
         server:
            webflux:
               routes:
               -  id: api-service
                  uri: http://localhost:${api.port}
                  predicates:
                  - Path=/ExempleService/**
                  filters:
                  - RewriteLocationResponseHeader=NEVER_STRIP, Location, ,
                  - TokenRelay=exemple-user
               -  id: authorization-token
                  uri: http://localhost:${authorization.port}
                  predicates:
                  - Path=/ExempleAuthorization/oauth/token
                  filters:
                  - RewriteLocationResponseHeader=NEVER_STRIP, Location, ,
                  - OAuthAccessToken=
                  - AddCsrfToken=
               -  id: authorization-revoke-token
                  uri: http://localhost:${authorization.port}
                  predicates:
                  - Path=/ExempleAuthorization/oauth/revoke_token
                  filters:
                  - OAuthRevokeToken=
               -  id: authorization-login
                  uri: http://localhost:${authorization.port}
                  predicates:
                  - Path=/ExempleAuthorization/login
                  filters:
                  - RewriteLocationResponseHeader=NEVER_STRIP, Location, ,
                  - SetStatus200IfRedirection=
                  - RemoveResponseHeader=Location
               -  id: authorization-service
                  uri: http://localhost:${authorization.port}
                  predicates:
                  - Path=/ExempleAuthorization/**
                  filters:
                  - RewriteLocationResponseHeader=NEVER_STRIP, Location, ,
api:
   port: ${api.port}
authorization:
   port: ${authorization.port}
public_key: classpath:public_key
private_key: classpath:private_key