logging:
   pattern:
      console: "%d %-5p: %C - %m%n"
   level:
      root: WARN
      com.exemple.gateway: DEBUG
      org.springframework.security: TRACE
      org.springframework.cloud: TRACE
gateway:
   security:
      excludes: /ExempleService, /ExempleAuthorization/login, /*/info, /*/health, /*/openapi.json
      csrf:
         excludes: /ExempleAuthorization/oauth/*
spring:
   hazelcast:
      config: file:${project.build.testOutputDirectory}/hazelcast.yaml
   security:
      oauth2:
         resourceserver:
            jwt:
               public-key-location: classpath:public_key
         client:
            provider:
               test:
                  token-uri: http://localhost:${authorization.port}/ExempleAuthorization/token
                  authorization-uri: /ExempleAuthorization/authorize
            registration:
                exemple-user:
                  client-id: client-user
                  client-secret: client-user-secret
                  client-authentication-method: client_secret_basic
                  authorization-grant-type: authorization_code
                  redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                  provider: test
                exemple-app:
                  client-id: client-app
                  client-secret: client-app-secret
                  client-authentication-method: client_secret_basic
                  authorization-grant-type: client_credentials
                  provider: test
   cloud:
      gateway:
         server:
            webflux:
               routes:
               -  id: resource protected by credentials
                  uri: http://localhost:${api.port}
                  predicates:
                  - Path=/Exemple/resource
                  - Method=POST
                  filters:
                  - TokenRelay=exemple-app
               -  id: resource protected by authorization code
                  uri: http://localhost:${api.port}
                  predicates:
                  - Path=/Exemple/resource/**
                  - Method=GET
                  filters:
                  - TokenRelay=exemple-user
               -  id: authorization-revoke-token
                  uri: http://localhost:${authorization.port}
                  predicates:
                  - Path=/ExempleAuthorization/oauth/revoke_token
                  filters:
                  - OAuthRevokeToken=
               -  id: authorization-login
                  uri: http://localhost:${authorization.port}
                  predicates:
                  - Path=/ExempleAuthorization/login
                  filters:
                  - RewriteLocationResponseHeader=AS_IN_REQUEST, Location, ,
                  - SetStatus200IfRedirection=
                  - RemoveResponseHeader=Location
               -  id: authorization
                  uri: http://localhost:${authorization.port}
                  predicates:
                  - Path=/ExempleAuthorization/authorize
                  filters:
                  - RewriteLocationResponseHeader=AS_IN_REQUEST, Location, ,
                  - SetStatus200IfRedirection=
api:
   port: ${api.port}
authorization:
   port: ${authorization.port}
public_key: classpath:public_key
private_key: classpath:private_key