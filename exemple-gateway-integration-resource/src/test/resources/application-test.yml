spring:
  security:
    oauth2:
      authorizationserver:
        client:
          test:
            registration:
              client-id: resource
              client-secret: "{noop}secret"
              client-name: Articles Client
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
                - refresh_token
                - client_credentials
              redirect-uris:
                - http://xxx
              scopes:
                - test:read
                - test:create
                - test:delete
                - test:update
            require-proof-key: true