logging:
   config: file:/usr/local/etc/gateway/logback.xml
gateway:
   security:
      csrf:
         excludes: /*/oauth/*, /*/login
spring:
   hazelcast:
      config: file:/usr/local/etc/gateway/hazelcast.yaml
   security:
      oauth2:
         resourceserver:
            jwt:
               jwk-set-uri: http://host.docker.internal:${test.port}/${test.contextpath}/oauth/jwks
         client:
            provider:
               test:
                  token-uri: http://host.docker.internal:${test.port}/${test.contextpath}/oauth/token
                  authorization-uri: /oauth/authorize
            registration:
                exemple-user:
                  client-id: resource
                  client-secret: secret
                  client-authentication-method: client_secret_basic
                  authorization-grant-type: authorization_code
                  redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                  provider: test
                exemple-app:
                  client-id: resource
                  client-secret: secret
                  client-authentication-method: client_secret_basic
                  authorization-grant-type: client_credentials
                  provider: test
   cloud:
      gateway:
         httpclient:
            connect-timeout: 1000
            response-timeout: 10s
         server:
            webflux:
               routes:
               -  id: authorization-login
                  uri: http://host.docker.internal:${test.port}/${test.contextpath}
                  predicates:
                  - Path=/${test.contextpath}/login
                  filters:
                  - RewriteLocationResponseHeader=NEVER_STRIP, Location, ,
                  - RemoveRequestHeader=cookie
                  - RemoveRequestHeader=x-xsrf-token
                  - SetStatus200IfRedirection=
                  - RemoveResponseHeader=Location
               -  id: authorization
                  uri: http://host.docker.internal:${test.port}/${test.contextpath}
                  predicates:
                  - Path=/${test.contextpath}/oauth/authorize
                  filters:
                  - SetStatus200IfRedirection=
               -  id: actuator
                  uri: http://host.docker.internal:${test.port}/${test.contextpath}
                  predicates:
                  - Path=/${test.contextpath}/actuator/**
                  filters:
                  - AddCsrfToken
               -  id: resource protected by credentials
                  uri: http://host.docker.internal:${test.port}/${test.contextpath}
                  predicates:
                  - Path=/${test.contextpath}/ws/test,/${test.contextpath}/ws/test/**
                  - Method=POST,HEAD,OPTIONS
                  filters:
                  - TokenRelay=exemple-app
                  - RemoveRequestHeader=cookie
               -  id: resource protected by authorization code
                  uri: http://host.docker.internal:${test.port}/${test.contextpath}/ws/test/**
                  predicates:
                  - Path=/${test.contextpath}/ws/test/**
                  - Method=GET,DELETE,PATCH
                  filters:
                  - TokenRelay=exemple-user